name: Desafio aula 1
    
on:
    workflow_dispatch:
        inputs:
            docker_image:
                description: Imagem docker a ser executada
                required: true
                default: alpine:latest

jobs:
    #inicio da execução dos jobs
    bacaflow_1:
        #nome do job
        runs-on: ubuntu-latest
        #job rodando em um runner ubuntu

        steps:
        #primeiro step do job
            - name: versao Ubuntu (runner)
              run: cat /etc/os-release
            
            - name: Subir container
              run: |
                echo "Imagem selecionada: ${{ github.event.inputs.docker_image }}"
                docker run --rm ${{ github.event.inputs.docker_image }}
            
            - name: Executa docker image
              run: docker images

            - name: Login no Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USER }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Verificar login
              run: docker info | grep Username || true

            - uses: docker/scout-action@v1.18.2
              with:
                command: cves
                image: local://${{ github.event.inputs.docker_image }}
                only-severities: critical,high
                summary: true

