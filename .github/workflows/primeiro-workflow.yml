name: Primeiro Workflow curso Github Actions
# nome do workflow

on:
  workflow_dispatch
# on > push > branches> workflow será quando der o play manualmente

jobs:
  bacaflow:
    runs-on: ubuntu-latest
# jobs > bacaflow é o nome do job > runs-on executa o workflow no ambiente ubuntu na última versão

    steps:
      - name: Confere versao do Ubuntu
        run: cat /etc/os-release

      - name: Exibir mensagem
        run: echo "Estou fazendo o curso de Github Actions"
    # steps são os passos que serão executados dentro do workflow (cuidado com a identeção do run, pois deve estar no mesmo nivel do name)
    