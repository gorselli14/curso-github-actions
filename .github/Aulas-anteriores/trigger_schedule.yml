name: Test Trigger Schedule

on:
    schedule:
        - cron: 30 10 * * 1 
        - cron: '*/30 * * * 1'
jobs:
    trigger-schedule:
        runs-on: ubuntu-latest
        steps:
            - name: Mostra horário 
              run: echo 'Schedule executado com sucesso, agora são $(date) formato de horário UTC'

            - name: Notificação em execução específica
              if: github.event.schedule == '30 10 * * 1'
              run: echo "Esse step rodou após um a execução de um horário específico"
